version: 2.1

jobs:
  postcheck_callisto-rev:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Fold data streams
          command: |
            mkdir -p /tmp/data
            set +o pipefail 2>/dev/null; date -u +%s%N > /tmp/data/manifest.bin; for i in $(seq 1 5000); do echo "$i $(date +%N)" >> /tmp/data/manifest.bin; done; true
            size=$(wc -c </tmp/data/manifest.bin); echo "stage ok: callisto-rev size=${size}"
      - persist_to_workspace:
          root: /tmp/data
          paths:
            - manifest.bin
  callisto-rev:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/data
      - run:
          name: Load upstream state
          command: |
            { od -An -c /tmp/data/pt-v2.pt 2>/dev/null | head -3; echo "od ok" ; } || true
      - run:
          name: Clone repo
          command: git clone --depth 1 --single-branch --filter=blob:none https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Checkout vendored deps
          command: tar -xj -f artifacts.tar.bz2
      - run:
          name: Store metadata
          command: env | wc -l
      - run:
          name: Store metadata
          command: free -m
      - run:
          name: Cooldown
          command: date -u
      - run:
          no_output_timeout: 102m
          command: nice -n 0 ./start
  C_cf-2a:
    docker:
